<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ branding.theme }}">
  <div class="page settings-page">
    <div class="card settings-card" style="max-width: 460px; margin: 80px auto 0;">
      <h1 style="margin-top: 0;">登录</h1>
      <p class="settings-section-desc">当前使用本地账号登录，W3账号在调试中。</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-card" style="padding-left: 0; padding-right: 0; box-shadow: none; background: transparent;">
            {% for message in messages %}
              <div class="flash-success">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% if auth_mode == 'hybrid' %}
      <div class="toolbar-actions" style="justify-content: flex-end; margin-bottom: 16px;">
        <a class="button" href="{{ url_for('oauth_login', next=next) }}">W3账号登录</a>
      </div>
      {% endif %}
      <form method="post" class="ios-settings-form" style="background: transparent; box-shadow: none; padding: 0;">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="ios-field">
          <span class="ios-field-label">账号</span>
          <input type="text" name="username" placeholder="请输入账号" required>
        </label>
        <label class="ios-field">
          <span class="ios-field-label">密码</span>
          <input type="password" name="password" placeholder="请输入密码" required>
        </label>
        <label class="ios-field">
          <span class="ios-field-label">图片验证码</span>
          <div style="display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;">
            <input type="text" name="captcha" placeholder="请输入图片验证码" autocomplete="off" required>
            <button type="button" class="button secondary" style="padding:0; overflow:hidden; height:44px; min-width:140px;" onclick="refreshLocalCaptcha()" title="点击刷新验证码">
              <img id="local-captcha-image" src="{{ url_for('local_login_captcha_image') }}" alt="图片验证码" width="140" height="44" style="display:block;">
            </button>
          </div>
        </label>
        <div class="toolbar-actions settings-actions" style="justify-content: flex-end;">
          <button type="submit" class="button">登录</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    function refreshLocalCaptcha() {
      const image = document.getElementById('local-captcha-image');
      if (image) image.src = "{{ url_for('local_login_captcha_image') }}?t=" + Date.now();
    }
  </script>
</body>
</html>
