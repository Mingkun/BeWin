<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if mode == 'edit' %}编辑服务资源记录{% else %}新增服务资源记录{% else %}
          <a class="button secondary" href="{{ url_for('oauth_login', next=request.path) }}">登录</a>
        {% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page form-page service-form-page">
    <header class="toolbar">
      <div>
        <h1>{% if mode == 'edit' %}编辑服务资源记录{% else %}新增服务资源记录{% endif %}</h1>
        <p>维护服务粒度的人力投入和服务说明。</p>
      </div>
      <div class="toolbar-actions">
        {% if current_user %}
          <span class="user-chip">已登录</span>
          <a class="button secondary" href="{{ url_for('oauth_logout') }}">退出登录</a>
        {% endif %}
        <a class="button secondary" href="{{ return_to or url_for('admin_service_resources') }}">返回列表</a>
      </div>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="card flash-card">
          {% for message in messages %}
            <div class="flash-success">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" class="card project-form">
      <div class="form-grid form-grid-3">
        <label>五层部门<textarea name="five_level_department" rows="2">{{ record.five_level_department or '' }}</textarea></label>
        <label>L4云服务<textarea name="l4_cloud_service" rows="2">{{ record.l4_cloud_service or '' }}</textarea></label>
        <label>功能和用途简介<textarea name="function_description" rows="2">{{ record.function_description or '' }}</textarea></label>
        <label>汇总（自有）<input class="readonly-summary" name="summary_self_owned" value="{{ record.summary_self_owned or '' }}" readonly tabindex="-1"></label>
        <label>汇总（OD）<input class="readonly-summary" name="summary_od" value="{{ record.summary_od or '' }}" readonly tabindex="-1"></label>
        <label>汇总（TM）<input class="readonly-summary" name="summary_tm" value="{{ record.summary_tm or '' }}" readonly tabindex="-1"></label>
        <label>HC（自有）<input name="hc_self_owned" value="{{ record.hc_self_owned or '' }}" data-summary-target="summary_self_owned"></label>
        <label>HC（OD）<input name="hc_od" value="{{ record.hc_od or '' }}" data-summary-target="summary_od"></label>
        <label>HC（TM）<input name="hc_tm" value="{{ record.hc_tm or '' }}" data-summary-target="summary_tm"></label>
        <label>HCS（自有）<input name="hcs_self_owned" value="{{ record.hcs_self_owned or '' }}" data-summary-target="summary_self_owned"></label>
        <label>HCS（OD）<input name="hcs_od" value="{{ record.hcs_od or '' }}" data-summary-target="summary_od"></label>
        <label>HCS（TM）<input name="hcs_tm" value="{{ record.hcs_tm or '' }}" data-summary-target="summary_tm"></label>
      </div>

      <div class="card inner-card">
        <label>二次确认码<input type="text" name="confirmation_code" placeholder="请输入二次确认码" required></label>
      </div>

      <div class="toolbar-actions">
        <a class="button secondary" href="{{ return_to or url_for('admin_service_resources') }}">取消</a>
        <button class="button" type="submit">保存</button>
      </div>
    </form>
  </div>
  <script>
    (function () {
      const form = document.querySelector('form');
      if (!form) return;

      const pairs = [
        ['hc_self_owned', 'hcs_self_owned', 'summary_self_owned'],
        ['hc_od', 'hcs_od', 'summary_od'],
        ['hc_tm', 'hcs_tm', 'summary_tm'],
      ];

      function toNumber(value) {
        const n = parseFloat(value);
        return Number.isFinite(n) ? n : 0;
      }

      function formatNumber(value) {
        return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(2)));
      }

      function recalc() {
        pairs.forEach(([leftName, rightName, summaryName]) => {
          const left = form.querySelector(`[name="${leftName}"]`);
          const right = form.querySelector(`[name="${rightName}"]`);
          const summary = form.querySelector(`[name="${summaryName}"]`);
          if (!left || !right || !summary) return;
          summary.value = formatNumber(toNumber(left.value) + toNumber(right.value));
        });
      }

      form.querySelectorAll('input[name^="hc_"], input[name^="hcs_"]').forEach((input) => {
        input.addEventListener('input', recalc);
      });

      recalc();
    })();
  </script>
</body>
</html>
