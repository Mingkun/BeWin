<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if mode == 'edit' %}编辑关键特性{% else %}新增关键特性{% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page form-page">
    <header class="toolbar">
      <div>
        <h1>{% if mode == 'edit' %}编辑关键特性{% else %}新增关键特性{% endif %}</h1>
        <p>维护关键特性、五层部门及月度排期。</p>
      </div>
      <div class="toolbar-actions">
        <a class="button secondary" href="{{ url_for('roadmap') }}">返回路标图</a>
      </div>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="card flash-card">
          {% for message in messages %}
            <div class="flash-success">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" class="card project-form">
      <div class="form-grid">
        <label>项目名称
          <select name="project_name" id="project_name" required>
            <option value="">请选择项目</option>
            {% for project in project_options %}
              <option value="{{ project.project_name }}" data-project-code="{{ project.project_code or '' }}" {% if feature.project_name == project.project_name %}selected{% endif %}>{{ project.project_name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>项目编码<input type="text" id="project_code" value="{{ feature.project_code or '' }}" readonly tabindex="-1"></label>
        <label>五层部门<textarea name="five_level_department" rows="2">{{ feature.five_level_department or '' }}</textarea></label>
        <label>服务交付PM<textarea name="delivery_pm" rows="2">{{ feature.delivery_pm or '' }}</textarea></label>
        <label>关键特性<textarea name="feature_name" rows="3">{{ feature.feature_name or '' }}</textarea></label>
        <label>L4服务或服务组<textarea name="service_group" rows="3">{{ feature.service_group or '' }}</textarea></label>
      </div>

      <label class="block-field">重点工作
        <textarea name="focus_work" rows="5">{{ feature.focus_work or '' }}</textarea>
      </label>

      <div class="card inner-card">
        <h3>月度排期</h3>
        <div class="month-grid-form">
          {% for month in months %}
            <label>{{ month }}<textarea name="{{ month }}" rows="3">{{ feature[month] if feature and month in feature else '' }}</textarea></label>
          {% endfor %}
        </div>
      </div>

      <div class="toolbar-actions">
        <a class="button secondary" href="{{ url_for('roadmap') }}">取消</a>
        <button class="button" type="submit">保存</button>
      </div>
    </form>
  </div>
  <script>
    (function () {
      const projectSelect = document.getElementById('project_name');
      const projectCodeInput = document.getElementById('project_code');
      if (!projectSelect || !projectCodeInput) return;

      function syncProjectCode() {
        const option = projectSelect.options[projectSelect.selectedIndex];
        projectCodeInput.value = option ? (option.getAttribute('data-project-code') || '') : '';
      }

      projectSelect.addEventListener('change', syncProjectCode);
      syncProjectCode();
    })();
  </script>
</body>
</html>
