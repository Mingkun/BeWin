<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if mode == 'edit' %}编辑人员{% else %}新增人员{% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="toolbar">
      <div>
        <h1>{% if mode == 'edit' %}编辑人员{% else %}新增人员{% endif %}</h1>
        <p>所属项目从项目视图已有项目中选择，部门从部门库中选择，均允许为空。</p>
      </div>
      <div class="toolbar-actions">
        <a class="button home-button" href="{{ url_for('index') }}">首页</a>
        <a class="button secondary" href="{{ url_for('admin_resource_people') }}">返回列表</a>
      </div>
    </header>

    <form method="post" class="card form-card">
      <div class="form-grid form-grid-2">
        <label>工号<input type="text" name="employee_id" value="{{ record.employee_id or '' }}"></label>
        <label>姓名<input type="text" name="employee_name" value="{{ record.employee_name or '' }}"></label>
        <label>人员类型
          <select name="person_type">
            <option value="" {% if not record.person_type %}selected{% endif %}>空白</option>
            <option value="自有" {% if record.person_type == '自有' %}selected{% endif %}>自有</option>
            <option value="OD" {% if record.person_type == 'OD' %}selected{% endif %}>OD</option>
            <option value="TM" {% if record.person_type == 'TM' %}selected{% endif %}>TM</option>
            <option value="在岸" {% if record.person_type == '在岸' %}selected{% endif %}>在岸</option>
            <option value="实习生" {% if record.person_type == '实习生' %}selected{% endif %}>实习生</option>
            <option value="博士后" {% if record.person_type == '博士后' %}selected{% endif %}>博士后</option>
          </select>
        </label>
        <label>最小部门
          <select name="department_id">
            <option value="">为空</option>
            {% for item in department_options %}
            <option value="{{ item.id }}" {% if record.department_id == item.id %}selected{% endif %}>{{ item.department_full_name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>所属项目
          <select name="project_id">
            <option value="">为空</option>
            {% for item in project_options %}
            <option value="{{ item.id }}" {% if record.project_id == item.id %}selected{% endif %}>{{ item.project_name }}</option>
            {% endfor %}
          </select>
        </label>
        <label>投入比例<input type="text" name="allocation_ratio" value="{{ record.allocation_ratio or '' }}" placeholder="例如 50% 或 0.5"></label>
        <label>角色
          <select name="role_name">
            <option value="" {% if not record.role_name %}selected{% endif %}>空白</option>
            <option value="开发" {% if record.role_name == '开发' %}selected{% endif %}>开发</option>
            <option value="测试" {% if record.role_name == '测试' %}selected{% endif %}>测试</option>
            <option value="运维" {% if record.role_name == '运维' %}selected{% endif %}>运维</option>
            <option value="资料" {% if record.role_name == '资料' %}selected{% endif %}>资料</option>
            <option value="用户体验" {% if record.role_name == '用户体验' %}selected{% endif %}>用户体验</option>
            <option value="架构师" {% if record.role_name == '架构师' %}selected{% endif %}>架构师</option>
            <option value="项目经理" {% if record.role_name == '项目经理' %}selected{% endif %}>项目经理</option>
            <option value="产品管理" {% if record.role_name == '产品管理' %}selected{% endif %}>产品管理</option>
            <option value="HR" {% if record.role_name == 'HR' %}selected{% endif %}>HR</option>
            <option value="其他" {% if record.role_name == '其他' %}selected{% endif %}>其他</option>
          </select>
        </label>
        <label>状态
          <select name="status">
            <option value="" {% if not record.status %}selected{% endif %}>空白</option>
            <option value="在岗" {% if record.status == '在岗' %}selected{% endif %}>在岗</option>
            <option value="请假" {% if record.status == '请假' %}selected{% endif %}>请假</option>
            <option value="支持外部会战" {% if record.status == '支持外部会战' %}selected{% endif %}>支持外部会战</option>
            <option value="待入场" {% if record.status == '待入场' %}selected{% endif %}>待入场</option>
            <option value="待切出" {% if record.status == '待切出' %}selected{% endif %}>待切出</option>
          </select>
        </label>
        <label style="grid-column:1 / -1;">备注<textarea name="remarks" rows="4">{{ record.remarks or '' }}</textarea></label>
      </div>
      <div class="form-actions">
        <button class="button" type="submit">保存</button>
        <a class="button secondary" href="{{ url_for('admin_resource_people') }}">取消</a>
      </div>
    </form>
  </div>
</body>
</html>
