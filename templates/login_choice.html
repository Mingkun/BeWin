<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择登录方式</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ branding.theme }}">
  <div class="page settings-page">
    <div class="card settings-card" style="max-width: 460px; margin: 80px auto 0;">
      <h1 style="margin-top: 0;">选择登录方式</h1>
      <p class="settings-section-desc">当前使用本地账号登录，W3账号在调试中。</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash-card" style="padding-left: 0; padding-right: 0; box-shadow: none; background: transparent;">
            {% for message in messages %}
              <div class="flash-success">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <div class="toolbar-actions" style="display:flex; flex-direction:column; align-items:stretch; gap:12px; margin-top:20px;">
        {% if oauth_enabled %}
        <a class="button" href="{{ url_for('oauth_login', next=next) }}">W3账号登录</a>
        {% endif %}
        {% if local_enabled %}
        <a class="button secondary" href="{{ url_for('local_login_form', next=next) }}">本地账号登录</a>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
