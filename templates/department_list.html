<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部门库</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="toolbar">
      <div>
        <h1>部门库</h1>
        <p>维护资源视图使用的部门层级，最高支持 2 层部门。</p>
      </div>
      <div class="toolbar-actions">
        <a class="button home-button" href="{{ url_for('index') }}">首页</a>
        <a class="button secondary" href="{{ url_for('admin_resource_people') }}">人员资源库</a>
      </div>
    </header>

    <div class="toolbar-actions" style="justify-content:flex-end; margin-bottom:12px;">
      <button class="button" type="button" id="show-new-department-row">新增</button>
    </div>

    <div class="table-wrap card">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>部门路径</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr id="new-department-row" hidden>
            <td>新增</td>
            <td>
              <div class="form-grid form-grid-2" style="gap:8px; min-width:320px;">
                <input form="new-department-form" type="text" name="level_1_department" placeholder="一级部门" required>
                <input form="new-department-form" type="text" name="level_2_department" placeholder="二级部门">
              </div>
            </td>
            <td>
              <div class="inline-actions">
                <button class="button tiny" form="new-department-form" type="submit">保存</button>
                <button class="button tiny secondary" type="button" id="cancel-new-department-row">取消</button>
              </div>
            </td>
          </tr>
          {% for record in records %}
          {% if edit_id and edit_id|int == record.id %}
          <tr>
            <form method="post" action="{{ url_for('admin_department_edit', department_id=record.id) }}">
              <td>{{ record.id }}</td>
              <td>
                <div class="form-grid form-grid-2" style="gap:8px; min-width:320px;">
                  <input type="text" name="level_1_department" value="{{ record.level_1_department or '' }}" placeholder="一级部门">
                  <input type="text" name="level_2_department" value="{{ record.level_2_department or '' }}" placeholder="二级部门">
                </div>
              </td>
              <td>
                <div class="inline-actions">
                  <button class="button tiny" type="submit">保存</button>
                  <a class="button tiny secondary" href="{{ url_for('admin_departments') }}">取消</a>
                </div>
              </td>
            </form>
          </tr>
          {% else %}
          <tr>
            <td>{{ record.id }}</td>
            <td>{{ record.department_full_name or '-' }}</td>
            <td>
              <div class="inline-actions">
                <a class="icon-action" href="{{ url_for('admin_departments', edit_id=record.id) }}" title="编辑">✏️</a>
                <form method="post" action="{{ url_for('admin_department_delete', department_id=record.id) }}" class="inline-delete-form">
                  <button class="icon-action danger delete-trigger" type="button" title="删除">🗑</button>
                  <div class="delete-popover" hidden>
                    <span class="delete-popover-text">确认删除？</span>
                    <div class="delete-popover-actions">
                      <button class="button tiny danger" type="submit">删</button>
                      <button class="button tiny secondary delete-cancel" type="button">取消</button>
                    </div>
                  </div>
                </form>
              </div>
            </td>
          </tr>
          {% endif %}
          {% endfor %}
          {% if not records %}
          <tr id="department-empty-row">
            <td colspan="3">当前还没有部门数据。</td>
          </tr>
          {% endif %}
        </tbody>
      </table>
    </div>
    <form method="post" action="{{ url_for('admin_department_new') }}" id="new-department-form"></form>
  </div>
  <script>
    (function () {
      const showNewButton = document.getElementById('show-new-department-row');
      const newRow = document.getElementById('new-department-row');
      const cancelNewButton = document.getElementById('cancel-new-department-row');
      const emptyRow = document.getElementById('department-empty-row');
      if (showNewButton && newRow) {
        showNewButton.addEventListener('click', () => {
          newRow.hidden = false;
          showNewButton.hidden = true;
          if (emptyRow) emptyRow.hidden = true;
          const firstInput = newRow.querySelector('input[name="level_1_department"]');
          if (firstInput) firstInput.focus();
        });
      }
      if (cancelNewButton && newRow && showNewButton) {
        cancelNewButton.addEventListener('click', () => {
          newRow.hidden = true;
          showNewButton.hidden = false;
          newRow.querySelectorAll('input').forEach((input) => {
            input.value = '';
          });
          if (emptyRow) emptyRow.hidden = false;
        });
      }

      document.querySelectorAll('.inline-delete-form').forEach((form) => {
        const trigger = form.querySelector('.delete-trigger');
        const popover = form.querySelector('.delete-popover');
        const cancel = form.querySelector('.delete-cancel');
        if (!trigger || !popover) return;

        trigger.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          document.querySelectorAll('.delete-popover').forEach((item) => {
            if (item !== popover) item.hidden = true;
          });
          popover.hidden = !popover.hidden;
        });

        if (cancel) {
          cancel.addEventListener('click', (event) => {
            event.preventDefault();
            popover.hidden = true;
          });
        }
      });

      document.addEventListener('click', (event) => {
        if (event.target.closest('.inline-delete-form')) return;
        document.querySelectorAll('.delete-popover').forEach((item) => {
          item.hidden = true;
        });
      });
    })();
  </script>
</body>
</html>
