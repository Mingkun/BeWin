<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部门库</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="toolbar">
      <div>
        <h1>部门库</h1>
        <p>维护资源视图使用的部门层级，最高支持 6 层部门。</p>
      </div>
      <div class="toolbar-actions">
        <a class="button home-button" href="{{ url_for('index') }}">首页</a>
        <a class="button secondary" href="{{ url_for('admin_resource_people') }}">人员资源库</a>
        <a class="button" href="{{ url_for('admin_department_new') }}">新增部门</a>
      </div>
    </header>
    {% if records %}
    <div class="table-wrap card">
      <table class="data-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>部门路径</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          {% for record in records %}
          <tr>
            <td>{{ record.id }}</td>
            <td>{{ record.department_full_name or '-' }}</td>
            <td>
              <div class="inline-actions">
                <a class="icon-action" href="{{ url_for('admin_department_edit', department_id=record.id) }}" title="编辑">✏️</a>
                <form method="post" action="{{ url_for('admin_department_delete', department_id=record.id) }}" class="inline-delete-form">
                  <button class="icon-action danger delete-trigger" type="button" title="删除">🗑</button>
                  <div class="delete-popover" hidden>
                    <span class="delete-popover-text">确认删除？</span>
                    <div class="delete-popover-actions">
                      <button class="button tiny danger" type="submit">删</button>
                      <button class="button tiny secondary delete-cancel" type="button">取消</button>
                    </div>
                  </div>
                </form>
              </div>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <div class="empty">当前还没有部门数据。</div>
    {% endif %}
  </div>
</body>
</html>
